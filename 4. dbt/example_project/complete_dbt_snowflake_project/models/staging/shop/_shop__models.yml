version: 2

models:
  - name: stg_shop__customers
    description: Cleaned customer records, one row per customer.
    columns:
      - name: customer_id
        description: Primary key.
        data_tests: [not_null, unique]
      - name: email
        data_tests:
          - not_null
      - name: country_code
        data_tests:
          - accepted_values:
              arguments:
                values: [VN, SG, TH]

  - name: stg_shop__orders
    description: Cleaned orders, one row per order.
    columns:
      - name: order_id
        data_tests: [not_null, unique]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_shop__customers')
                field: customer_id
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: [placed, paid, shipped, completed, cancelled]
      - name: order_date
        data_tests:
          - not_null
          - not_in_future

  - name: stg_shop__order_items
    description: Cleaned order lines, one row per order item.
    columns:
      - name: order_item_id
        data_tests: [not_null, unique]
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_shop__orders')
                field: order_id
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_shop__products')
                field: product_id
      - name: quantity
        data_tests:
          - positive_value

  - name: stg_shop__products
    description: Cleaned product catalog, one row per product.
    columns:
      - name: product_id
        data_tests: [not_null, unique]

  - name: stg_shop__payments
    description: Cleaned payment events, one row per payment event.
    columns:
      - name: payment_id
        data_tests: [not_null, unique]
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_shop__orders')
                field: order_id

